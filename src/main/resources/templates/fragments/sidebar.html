<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<body>

<aside th:fragment="sidebar" class="sidebar">

    <!-- LOGO -->

    <div class="sidebar-logo">

        <div class="logo-icon">

            <i class="bi bi-check2-square"></i>

        </div>

        <span>
            WebTodoList
        </span>

    </div>

    <!-- MENÚ -->

    <nav class="sidebar-menu">

        <small class="menu-title">
            MENÚ PRINCIPAL
        </small>

        <a th:href="@{/agregartarea}" class="sidebar-link">
            <i class="bi bi-plus-circle-dotted"></i>

            <span>
                Agregar tarea
            </span>

        </a>

        <a th:href="@{/mostrarmistareas}" class="sidebar-link">
            <i class="bi bi-list-task"></i>

            <span>
                Mis tareas
            </span>

        </a>

        <a href="/tareas/publicas" class="sidebar-link">
            <i class="bi bi-globe2"></i>

            <span>
                Tareas públicas
            </span>

        </a>

        <small class="menu-title mt-4">
            CUENTA
        </small>


        <a class="sidebar-link">

            <i class="bi bi-person"></i>

            <span>
                Mi perfil:
                <span th:text="${#authentication.name}"> Usuario </span>

            </span>

        </a>


        <form th:action="@{/logout}"
              method="post">

            <button type="submit"
                    class="sidebar-link logout-button">

                <i class="bi bi-box-arrow-right"></i>

                <span>
                    Cerrar sesión
                </span>

            </button>

        </form>

    </nav>

</aside>

</body>
</html>
