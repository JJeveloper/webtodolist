<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agregar tarea</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>

<div class="dashboard-container">

    <!-- SIDEBAR -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main-content">

        <!-- NAVBAR -->
        <!--<div th:replace="~{fragments/navbar :: navbar}"></div>-->

        <!-- CONTENIDO -->
        <main class="content">

            <div class="page-header">
                <small class="text-muted">
                    Tareas / Nueva tarea
                </small>

                <h4 class="fw-bold">
                    Agregar tarea
                </h4>

                <!-- Mensaje de error, nombre de usuario duplicado -->
                <div th:if="${validarFechas}" class="alert alert-danger">
                    <span th:text="${validarFechas}"></span>
                </div>

                <!-- Mensaje de éxito} -->
                <div th:if="${successT}" id="successAlert" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${successT}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>


            </div>

            <div class="row justify-content-center">

                <div class="col-lg-8">

                    <div class="soft-card">

                        <div class="mb-4">

                            <h5 class="fw-bold">
                                Nueva tarea
                            </h5>

                            <p class="text-muted mb-0">
                                Completa los datos de la tarea.
                            </p>

                        </div>


                        <form th:action="@{/guardartarea}" method="post" th:object="${aTarea}">

                            <!-- TÍTULO -->
                            <div class="mb-3">
                                <label for="tarea" class="form-label">
                                    Título
                                </label>

                                <input type="text" id="tarea" class="form-control" th:field="*{tarea}">
                                       placeholder="Ej. Estudiar Spring Security" required>
                                <div class="text-danger" th:errors="*{tarea}"></div>
                            </div>

                            <!-- DESCRIPCIÓN -->
                            <div class="mb-3">
                                <label for="descripcion" class="form-label">
                                    Descripción
                                </label>

                                <textarea id="descripcion" class="form-control" rows="4" th:field="*{descripcion}">
                                          placeholder="Describe la tarea...">
                                </textarea>

                                <div class="text-danger" th:errors="*{descripcion}"></div>
                            </div>

                            <!-- TIPO -->
                            <div class="mb-3">
                                <label for="tipo" class="form-label">
                                    Tipo de tarea
                                </label>

                                <select th:field="*{visibilidad}" id="tipo"  class="form-select">
                                    <option value="PUBLICA">Pública</option>
                                    <option value="PRIVADA"> Privada</option>
                                </select>

                                <div class="text-danger" th:errors="*{visibilidad}"></div>
                            </div>

                            <div class="row">

                                <!-- FECHA INICIO -->
                                <div class="col-md-6 mb-3">
                                    <label for="fechaInicio" class="form-label">
                                        Fecha de inicio
                                    </label>

                                    <input type="date" id="fechaInicio" th:field="*{fechaInicio}" class="form-control" required>

                                    <div class="text-danger" th:errors="*{fechaInicio}"></div>
                                </div>

                                <!-- FECHA FIN -->
                                <div class="col-md-6 mb-3">
                                    <label for="fechaFin" class="form-label">
                                        Fecha de finalización
                                    </label>

                                    <input type="date" id="fechaFin" th:field="*{fechaFin}" class="form-control" required>

                                    <div class="text-danger" th:errors="*{fechaFin}"></div>
                                </div>

                            </div>

                            <!-- BOTONES -->

                            <div class="d-flex justify-content-end gap-2 mt-4">
                                <a href="/dashboard" class="btn btn-light">
                                    Cancelar
                                </a>

                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-lg"></i>
                                    Guardar tarea
                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </main>

    </div>

</div>


</body>
</html>
